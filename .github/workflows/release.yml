name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - name: Require master
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [ "$RELEASE_REF" != refs/heads/master ]; then
            echo 'Select master in Run workflow. Releases can only be built from master.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Read and validate release version
        id: metadata
        run: python scripts/release.py metadata >> "$GITHUB_OUTPUT"
      - name: Check existing tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/release.py check-remote --commit "$GITHUB_SHA"

  checks:
    needs: prepare
    uses: ./.github/workflows/check.yml

  build:
    needs: [prepare, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev gcc-mingw-w64 pkg-config
      - name: Install Rust
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --locked --profile dist --target ${{ matrix.target }}
      - name: Package versioned archives and updater aliases
        run: python scripts/release.py package --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: mint-v${{ needs.prepare.outputs.version }}-${{ matrix.target }}
          path: artifacts/*.zip
          if-no-files-found: error

  draft-release:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: mint-v${{ needs.prepare.outputs.version }}-*
          merge-multiple: true
          path: artifacts
      - name: Recheck release and create tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/release.py create-tag --commit "$GITHUB_SHA"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/*.zip --verify-tag --target "$GITHUB_SHA" --draft \
            --title "MINT Maintained $RELEASE_TAG" --generate-notes
          echo "Draft $RELEASE_TAG uploaded. Review the packages and notes, then publish it from Releases." >> "$GITHUB_STEP_SUMMARY"
