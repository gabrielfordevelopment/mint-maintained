name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: mint
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: mint.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev gcc-mingw-w64 pkg-config
      - name: Install Rust
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = ($metadata.packages | Where-Object name -eq mint).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Release tag must match the workspace version.' }
      - name: Build
        run: cargo build --locked --profile dist --target ${{ matrix.target }}
      - name: Package
        shell: pwsh
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_BINARY: ${{ matrix.binary }}
        run: |
          New-Item -ItemType Directory -Path package, package/assets/icons | Out-Null
          Copy-Item "target/$env:BUILD_TARGET/dist/$env:BUILD_BINARY" package/
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md package/
          Copy-Item assets/icons/LICENSE, assets/icons/DEPENDENCY_LICENSES.txt package/assets/icons/
          Compress-Archive -Path package/* -DestinationPath "mint-$env:BUILD_TARGET.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mint-${{ matrix.target }}
          path: mint-${{ matrix.target }}.zip
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mint-*
          merge-multiple: true
          path: artifacts
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/*.zip --verify-tag --draft --title "MINT Maintained $RELEASE_TAG" --generate-notes
