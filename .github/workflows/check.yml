name: Run checks

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  agent-guidance:
    name: Agent guidance
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate agent guidance
        run: python scripts/check_agent_guidance.py
      - name: Test repository scripts
        run: python -m unittest discover -s scripts/tests

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev gcc-mingw-w64 pkg-config
      - name: Install Rust
        run: rustup show
      - name: Link the Linux build's hook with lld
        if: runner.os == 'Linux'
        # The distribution's MinGW GCC honors -fuse-ld=lld only through this file name and
        # otherwise falls back to GNU ld. See .cargo/config.toml.
        run: sudo ln -sf "$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld" /usr/bin/x86_64-w64-mingw32-ld.lld
      - name: Install check tools
        run: rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Check Clippy
        run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked -p mint -p mint_lib
      - name: Build
        run: cargo build --locked
