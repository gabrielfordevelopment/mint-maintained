[workspace]
members = [
  "mint_lib",
  "hook",
  "hook_resolvers",
]

[workspace.package]
repository = "https://github.com/gabrielfordevelopment/mint-maintained"
authors = ["trumank", "jieyouxu"]
license = "MIT OR Apache-2.0"
version = "0.3.0"
edition = "2024"

[workspace.dependencies]
anyhow = { version = "1.0.99", features = ["backtrace"] }
patternsleuth = { git = "https://github.com/trumank/patternsleuth" }
steamlocate = "2.0.1"
repak = { git = "https://github.com/trumank/repak", features = ["oodle"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
itertools = "0.14.0"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
fs-err = "3.1.1"
tracing = { version = "0.1.41", features = ["attributes"] }
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter", "std", "registry"] }
tokio = "1.47.1"
reqwest = { version = "0.11.27", default-features = false, features = ["blocking", "rustls", "json"] }
snafu = "0.8.7"
resvg = { version = "0.48.1", default-features = false }
image = { version = "0.25.6", default-features = false, features = ["png"] }

[package]
name = "mint"
repository.workspace = true
authors.workspace = true
license.workspace = true
version.workspace = true
edition.workspace = true

[features]
default = ["hook"]
hook = ["dep:hook"]
debug = ["egui/deadlock_detection"]

[dependencies]
ansi_term = "0.12.1"
anyhow.workspace = true
async-trait = "0.1.89"
clap = { version = "4.5.46", features = ["derive"] }
chrono = { version = "0.4.31", default-features = false, features = ["std"] }
dialoguer = "0.11.0"
directories = "6.0.0"
eframe = "0.31.1"
egui = "0.31.1"
resvg.workspace = true
egui_commonmark = "0.20.0"
futures = "0.3.31"
hex = "0.4.3"
image.workspace = true
indexmap = { version = "2.11.0", features = ["serde"] }
inventory = "0.3.21"
mint_lib = { path = "mint_lib" }
modio = { git = "https://github.com/trumank/modio-rs.git", branch = "dev", default-features = false, features = ["rustls-tls"] }
obake = { version = "1.0.5", features = ["serde"] }
opener = "0.7.2"
path-slash = "0.2.1"
rayon = "1.11.0"
regex = "1.11.2"
reqwest.workspace = true
reqwest-middleware = "0.2.5"
rfd = "0.15.4"
rust-ini = "0.21.1"
self_update = { version = "0.42.0", default-features = false, features = ["archive-zip", "rustls"] }
semver = "1.0.26"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
steamlocate.workspace = true
task-local-extensions = "0.1.4"
tempfile = "3.21.0"
thiserror = "2.0.16"
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
typetag = "0.2.20"
uasset_utils = { git = "https://github.com/trumank/uasset_utils" }
unreal_asset = { git = "https://github.com/trumank/unrealmodding", branch = "patches" }
url = "2.5.7"
zip = { version = "2.6.1", default-features = false, features = ["aes-crypto", "deflate", "time"] }
repak.workspace = true
include_dir = "0.7.4"
postcard.workspace = true
fs-err.workspace = true
snafu.workspace = true
strum = { version = "0.27", features = ["derive"] }
itertools.workspace = true

[target.'cfg(target_env = "msvc")'.dependencies]
hook = { path = "hook", artifact = "cdylib", optional = true, target = "x86_64-pc-windows-msvc"}
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
[target.'cfg(not(target_env = "msvc"))'.dependencies]
hook = { path = "hook", artifact = "cdylib", optional = true, target = "x86_64-pc-windows-gnu"}

# Release archive build profile.
[profile.dist]
inherits = "release"
debug = false
strip = true

[profile.dev]
opt-level = 3
lto = "off"

[dev-dependencies]
mockall = "0.13.1"
tracing-subscriber.workspace = true

[build-dependencies]
winresource = { version = "0.1.31", default-features = false }
resvg.workspace = true
image = { workspace = true, features = ["ico"] }
